name: SonarQube Cloud

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: SonarQube public code
    # Only reviewed branches may receive the analysis token, including manual runs.
    # Activate after verifying the free plan, public project, and scoped token.
    if: >-
      github.repository == 'CLR-Technologies-Inc/withys-public' &&
      github.event.repository.private == false &&
      vars.SONAR_SCANNING_ENABLED == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check SonarQube configuration
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          for name in SONAR_ORGANIZATION SONAR_PROJECT_KEY SONAR_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Complete the free-plan setup in docs/free-code-scanning.md."
              exit 1
            fi
          done

      - name: Check out public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Set up Node for TypeScript analysis prerequisites
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Resolve the public application's TypeScript configuration
        working-directory: app
        timeout-minutes: 5
        # Expo's tsconfig.base lives in node_modules; do not execute lifecycle scripts.
        run: npm ci --ignore-scripts --no-audit --no-fund --include=dev

      - name: Scan public code
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scannerVersion: 8.1.0.6389
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
