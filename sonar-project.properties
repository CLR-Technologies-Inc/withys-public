# Provider-generated identity is supplied through repository Actions variables.
sonar.projectName=Withys Public
sonar.sourceEncoding=UTF-8

# Only this public repository's application is in analysis scope.
sonar.sources=app
sonar.tests=app
sonar.test.inclusions=**/__tests__/**,**/*.test.*,**/*.spec.*
sonar.exclusions=**/__tests__/**,**/*.test.*,**/*.spec.*,**/node_modules/**,**/.expo/**,**/dist/**,**/coverage/**,**/target/**,**/*.min.js
sonar.scm.exclusions.disabled=false
